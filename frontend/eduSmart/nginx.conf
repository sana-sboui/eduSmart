server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # ---------------------------
    # SPA fallback for Ionic/Angular
    # ---------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------
    # OPTIONAL: Proxy /api to backend
    # Uncomment if needed
    # ---------------------------
    # location /api/ {
    #     proxy_pass http://backend:8000;   # change to your backend address
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ---------------------------
    # Compression
    # ---------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/rss+xml application/xml+rss text/javascript image/svg+xml;
    gzip_proxied any;

    # ---------------------------
    # Cache static files for 7 days
    # ---------------------------
    location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js)$ {
        expires 7d;
        access_log off;
    }
}
