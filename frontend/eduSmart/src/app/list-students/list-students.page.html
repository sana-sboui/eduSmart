<ion-content class="ion-padding">
  <div class="illustration-section">
    <div class="lock-icon-container">
      <ion-icon name="people-outline" class="lock-icon"></ion-icon>
    </div>
  </div>
  <div class="title-section">
    <h1>Students Management</h1>
    <p>View, search, and manage all registered students in the system.</p>
  </div>

  <!-- Search -->
  <ion-searchbar
    placeholder="Search ..."
    [(ngModel)]="searchTerm"
    animated
  ></ion-searchbar>

  <!-- Filters -->
  <div class="filter-container">
    <div
      *ngFor="let f of filters"
      class="chip"
      [class.active]="activeFilter === f"
      (click)="setActiveFilter(f)"
    >
      {{ f }}
    </div>
  </div>

  <!-- Student list -->
  <div class="enseignants-list">
    <ion-card class="teacher-card" *ngFor="let s of filteredStudents">
      <div class="card-content">
        <div class="header">
          <div class="avatar">
            {{ getInitials(s.first_name!,s.last_name!) }}
          </div>

          <div class="info">
            <h3>{{ s.last_name }} {{ s.first_name}}</h3>
            <p class="subject">{{ s.group?.name }}</p>
          </div>
        </div>

        <div class="details">
          <div class="detail-item">
            <ion-icon name="person-outline"></ion-icon>
            <span>{{ s.username }}</span>
          </div>
          <div class="detail-item">
            <ion-icon name="call-outline"></ion-icon>
            <span>{{ s.tel }}</span>
          </div>
          <div class="detail-item">
            <ion-icon name="mail-outline"></ion-icon>
            <span>{{ s.email }}</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <ion-button
          fill="clear"
          color="danger"
          (click)="onDelete(s.id!)"
          class="action-btn"
        >
          <ion-icon
            name="trash-outline"
            size="large"
            slot="icon-only"
          ></ion-icon>
        </ion-button>
      </div>
    </ion-card>
  </div>
</ion-content>
