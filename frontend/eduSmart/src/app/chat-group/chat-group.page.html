<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Group Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let msg of messages()">
      <ion-label>
        <strong>{{ msg.sender }}:</strong>
        <p>{{ msg.content }}</p>
        <small *ngIf="msg.timestamp">{{ msg.timestamp }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="input-group ion-padding-top">
    <ion-input
      [(ngModel)]="newMessage"
      placeholder="Type a message"
      name="message"
    ></ion-input>
    <ion-button (click)="sendMessage()">Send</ion-button>
  </div>
</ion-content>
